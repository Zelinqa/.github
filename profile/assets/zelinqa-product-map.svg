<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 540" role="img" aria-labelledby="t d">
  <title id="t">Zelinqa product map</title>
  <desc id="d">Your AI agent connects to the Zelinqa engine through the Python and TypeScript SDKs or the MCP server to create better conversations.</desc>
  <defs>
    <style>
      .label { font-family: -apple-system, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif; fill: #0B1F33; }
      .card { fill: #F7F5FF; stroke: #D9D5F5; stroke-width: 2; }
      .link { stroke: #6D28D9; stroke-width: 4; stroke-dasharray: 10 10; fill: none; }
      .dot { fill: #6D28D9; }
    </style>
  </defs>
  <rect width="1600" height="540" fill="#FFFFFF"/>

  <!-- Your AI agent -->
  <rect x="30" y="70" width="350" height="150" rx="16" class="card"/>
  <g transform="translate(70 100)">
    <circle cx="45" cy="45" r="36" fill="none" stroke="#6D28D9" stroke-width="7"/>
    <circle cx="32" cy="40" r="5" fill="#6D28D9"/>
    <circle cx="58" cy="40" r="5" fill="#6D28D9"/>
    <path d="M30 58 Q45 70 60 58" stroke="#6D28D9" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M45 9 V-2" stroke="#6D28D9" stroke-width="6" stroke-linecap="round"/>
  </g>
  <text x="170" y="155" class="label" font-size="31" font-weight="600">Your AI agent</text>

  <!-- Zelinqa engine -->
  <rect x="530" y="45" width="540" height="200" rx="26" fill="#0B1F33"/>
  <g transform="translate(575 75) scale(0.23)">
    <path d="M46 372 A270 270 0 1 1 126 487 C110 523 82 549 47 567 C35 573 25 563 33 553 C50 532 52 447 46 372 Z" fill="#5846D6" stroke="#4336B4" stroke-width="6" stroke-linejoin="round"/>
    <path d="M88 118 H430 C388 167 314 214 251 270 C188 326 168 387 214 426 C262 467 361 446 452 425 C395 468 337 518 341 569 C346 625 425 646 500 580" stroke="#FFFFFF" stroke-width="78" stroke-linecap="round" stroke-linejoin="round" fill="none" transform="translate(94 8) scale(.70)"/>
  </g>
  <text x="730" y="138" class="label" fill="#FFFFFF" font-size="46" font-weight="700" style="fill:#FFFFFF">Zelinqa engine</text>
  <text x="730" y="188" class="label" font-size="30" font-weight="500" style="fill:#B9A7FF">Next-question API</text>

  <!-- Better conversations -->
  <rect x="1245" y="70" width="325" height="150" rx="16" class="card"/>
  <g transform="translate(1275 105)">
    <path d="M8 8 H78 a10 10 0 0 1 10 10 V52 a10 10 0 0 1 -10 10 H40 L20 78 V62 H18 A10 10 0 0 1 8 52 Z" fill="none" stroke="#6D28D9" stroke-width="6" stroke-linejoin="round"/>
    <circle cx="30" cy="35" r="4" fill="#6D28D9"/><circle cx="48" cy="35" r="4" fill="#6D28D9"/><circle cx="66" cy="35" r="4" fill="#6D28D9"/>
  </g>
  <text x="1375" y="138" class="label" font-size="30" font-weight="600">Better</text>
  <text x="1375" y="180" class="label" font-size="30" font-weight="600">conversations</text>

  <!-- links top -->
  <line x1="380" y1="145" x2="530" y2="145" class="link"/>
  <circle cx="400" cy="145" r="9" class="dot"/><circle cx="510" cy="145" r="9" class="dot"/>
  <line x1="1070" y1="145" x2="1245" y2="145" class="link"/>
  <circle cx="1090" cy="145" r="9" class="dot"/><circle cx="1225" cy="145" r="9" class="dot"/>

  <!-- links bottom -->
  <path d="M800 245 V300 H535 V345" class="link"/>
  <path d="M800 300 H1065 V345" class="link"/>
  <circle cx="535" cy="340" r="9" class="dot"/><circle cx="1065" cy="340" r="9" class="dot"/>

  <!-- SDK -->
  <rect x="385" y="355" width="390" height="135" rx="16" class="card"/>
  <text x="415" y="440" class="label" font-size="44" font-weight="700" style="fill:#6D28D9">&lt;/&gt;</text>
  <text x="530" y="415" class="label" font-size="34" font-weight="700">SDK</text>
  <text x="530" y="455" class="label" font-size="26" font-weight="500">Python &amp; TypeScript</text>

  <!-- MCP -->
  <rect x="870" y="355" width="335" height="135" rx="16" class="card"/>
  <g transform="translate(900 385)">
    <path d="M14 14 H40 a12 12 0 0 1 24 0 H84 V44 a12 12 0 0 0 0 24 V96 H60 a12 12 0 0 1 -24 0 H14 V68 a12 12 0 0 1 0 -24 Z" fill="none" stroke="#6D28D9" stroke-width="6" stroke-linejoin="round" transform="scale(0.72)"/>
  </g>
  <text x="1000" y="415" class="label" font-size="34" font-weight="700">MCP</text>
  <text x="1000" y="455" class="label" font-size="26" font-weight="500">AI agent tools</text>
</svg>
